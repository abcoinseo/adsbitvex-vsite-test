<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Defender Pro</title>
    <style>
        /* --- CSS STYLING --- */
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: white;
            font-family: 'Orbitron', sans-serif;
            overflow: hidden; /* Prevent scrolling */
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Game Container */
        #game-container {
            position: relative;
            flex-grow: 1;
            width: 100%;
            height: calc(100vh - 60px); /* Leave room for ad footer */
            background: radial-gradient(circle at center, #1a1a2e 0%, #000000 100%);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through to canvas */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* HUD */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            text-shadow: 0 0 10px cyan;
            pointer-events: none;
        }

        /* Menus */
        .menu {
            background: rgba(0, 0, 0, 0.85);
            padding: 40px;
            border: 2px solid cyan;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 20px cyan;
            pointer-events: auto;
            backdrop-filter: blur(5px);
        }

        h1 {
            margin: 0 0 20px 0;
            font-size: 48px;
            text-transform: uppercase;
            letter-spacing: 4px;
            background: linear-gradient(to right, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        button {
            background: transparent;
            color: cyan;
            border: 2px solid cyan;
            padding: 15px 40px;
            font-size: 20px;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            margin-top: 10px;
        }

        button:hover {
            background: cyan;
            color: black;
            box-shadow: 0 0 20px cyan;
        }

        #game-over-menu {
            display: none;
        }

        .hidden {
            display: none !important;
        }

        /* Footer Ad Container */
        #ad-footer {
            height: 60px; /* Fixed height for ad area */
            width: 100%;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            border-top: 1px solid #333;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <!-- GAME AREA -->
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui-layer">
            <div id="hud" class="hidden">Score: <span id="scoreEl">0</span></div>
            
            <div id="start-menu" class="menu">
                <h1>Neon Defender</h1>
                <p>Mouse to Move • Click to Shoot</p>
                <button id="startBtn">Start Game</button>
            </div>

            <div id="game-over-menu" class="menu">
                <h1>Game Over</h1>
                <h2 id="finalScore">0</h2>
                <button id="restartBtn">Try Again</button>
            </div>
        </div>
    </div>

    <!-- FOOTER ADVERTISEMENT -->
    <footer id="ad-footer">
        <div class='MainAdverTiseMentDiv' 
             data-publisher="eyJpdiI6InFoVDd3V2pyaUt3cFdTdW8xZHdyVGc9PSIsInZhbHVlIjoiMXpaTE9wNEljYnp0QUNwWUFyUXM3dz09IiwibWFjIjoiNTAyZWYzOGZjZWI4ZjFlZjUzYjUyZjgzMmVhZjFjNGI0OWVmZGIwYTAyNWZlNTI0YzY0MWU3OGEzOTM4ZWUzMCIsInRhZyI6IiJ9" 
             data-adsize="320x50">
        </div> 
        <script class="adScriptClass" src="https://adsbitvex.com/assets/ads/ad.js"></script>
    </footer>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('scoreEl');
        const startMenu = document.getElementById('start-menu');
        const gameOverMenu = document.getElementById('game-over-menu');
        const hud = document.getElementById('hud');
        const finalScoreEl = document.getElementById('finalScore');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');

        // Resize Canvas
        function resize() {
            canvas.width = document.getElementById('game-container').offsetWidth;
            canvas.height = document.getElementById('game-container').offsetHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Game State
        let gameActive = false;
        let score = 0;
        let animationId;
        let spawnInterval;
        
        // Mouse Position
        const mouse = { x: canvas.width / 2, y: canvas.height / 2 };
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        });

        canvas.addEventListener('mousedown', () => {
            if (gameActive) player.shoot();
        });

        // Classes
        class Player {
            constructor() {
                this.x = canvas.width / 2;
                this.y = canvas.height / 2;
                this.radius = 15;
                this.color = 'cyan';
                this.velocity = { x: 0, y: 0 };
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                // Rotate towards mouse
                const angle = Math.atan2(mouse.y - this.y, mouse.x - this.x);
                ctx.rotate(angle);
                
                ctx.beginPath();
                ctx.moveTo(20, 0);
                ctx.lineTo(-15, 10);
                ctx.lineTo(-15, -10);
                ctx.closePath();
                
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }

            update() {
                // Smooth follow mouse (Lerp)
                const delay = 0.08;
                this.x += (mouse.x - this.x) * delay;
                this.y += (mouse.y - this.y) * delay;
                this.draw();
            }

            shoot() {
                const angle = Math.atan2(mouse.y - this.y, mouse.x - this.x);
                const velocity = {
                    x: Math.cos(angle) * 12,
                    y: Math.sin(angle) * 12
                };
                projectiles.push(new Projectile(this.x, this.y, 4, 'yellow', velocity));
                
                // Recoil effect (create particle)
                particles.push(new Particle(this.x, this.y, Math.random() * 2, this.color, {
                    x: -velocity.x * 0.2,
                    y: -velocity.y * 0.2
                }));
            }
        }

        class Projectile {
            constructor(x, y, radius, color, velocity) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.color = color;
                this.velocity = velocity;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2, false);
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.fill();
            }

            update() {
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.draw();
            }
        }

        class Enemy {
            constructor(x, y, radius, color, velocity) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.color = color;
                this.velocity = velocity;
            }

            draw() {
                ctx.beginPath();
                // Draw a hexagon
                const numberOfSides = 6;
                ctx.moveTo(this.x + this.radius * Math.cos(0), this.y + this.radius * Math.sin(0));
                for (let i = 1; i <= numberOfSides; i += 1) {
                    ctx.lineTo(this.x + this.radius * Math.cos(i * 2 * Math.PI / numberOfSides), this.y + this.radius * Math.sin(i * 2 * Math.PI / numberOfSides));
                }
                
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.lineWidth = 3;
                ctx.strokeStyle = this.color;
                ctx.stroke();
                // Inner fill opacity
                ctx.fillStyle = this.color.replace(')', ', 0.1)').replace('rgb', 'rgba');
                ctx.fill();
            }

            update() {
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.draw();
            }
        }

        class Particle {
            constructor(x, y, radius, color, velocity) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.color = color;
                this.velocity = velocity;
                this.alpha = 1;
                this.friction = 0.98;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.velocity.x *= this.friction;
                this.velocity.y *= this.friction;
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.alpha -= 0.02; // Fade out
                this.draw();
            }
        }

        class Star {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.radius = Math.random() * 2;
                this.alpha = Math.random();
            }
            
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2, false);
                ctx.fillStyle = 'white';
                ctx.fill();
                ctx.restore();
            }

            update() {
                // Parallax drift
                this.y += 0.2;
                if(this.y > canvas.height) this.y = 0;
                this.draw();
            }
        }

        // Arrays
        let player = new Player();
        let projectiles = [];
        let enemies = [];
        let particles = [];
        let stars = [];

        // Setup Stars
        for(let i=0; i<50; i++) {
            stars.push(new Star());
        }

        function spawnEnemies() {
            spawnInterval = setInterval(() => {
                const radius = Math.random() * (30 - 10) + 10;
                let x, y;

                if (Math.random() < 0.5) {
                    x = Math.random() < 0.5 ? 0 - radius : canvas.width + radius;
                    y = Math.random() * canvas.height;
                } else {
                    x = Math.random() * canvas.width;
                    y = Math.random() < 0.5 ? 0 - radius : canvas.height + radius;
                }

                const color = `hsl(${Math.random() * 360}, 50%, 50%)`;
                
                // Calculate angle to player
                const angle = Math.atan2(player.y - y, player.x - x);
                const velocity = {
                    x: Math.cos(angle) * (1 + score/500), // Speed up as score increases
                    y: Math.sin(angle) * (1 + score/500)
                };

                enemies.push(new Enemy(x, y, radius, color, velocity));
            }, 1000);
        }

        function init() {
            player = new Player();
            projectiles = [];
            enemies = [];
            particles = [];
            score = 0;
            scoreEl.innerText = score;
            gameActive = true;
            hud.classList.remove('hidden');
            spawnEnemies();
        }

        function animate() {
            animationId = requestAnimationFrame(animate);
            
            // Clear Screen with fade effect for trails
            ctx.fillStyle = 'rgba(5, 5, 5, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Stars
            stars.forEach(star => star.update());

            player.update();

            // Particles
            particles.forEach((particle, index) => {
                if (particle.alpha <= 0) {
                    particles.splice(index, 1);
                } else {
                    particle.update();
                }
            });

            // Projectiles
            projectiles.forEach((projectile, index) => {
                projectile.update();

                // Remove from edges
                if (projectile.x + projectile.radius < 0 ||
                    projectile.x - projectile.radius > canvas.width ||
                    projectile.y + projectile.radius < 0 ||
                    projectile.y - projectile.radius > canvas.height) {
                    setTimeout(() => {
                        projectiles.splice(index, 1);
                    }, 0);
                }
            });

            // Enemies
            enemies.forEach((enemy, index) => {
                enemy.update();

                const dist = Math.hypot(player.x - enemy.x, player.y - enemy.y);
                
                // End Game
                if (dist - enemy.radius - player.radius < 1) {
                    cancelAnimationFrame(animationId);
                    clearInterval(spawnInterval);
                    gameActive = false;
                    
                    finalScoreEl.innerText = score;
                    startMenu.classList.add('hidden');
                    hud.classList.add('hidden');
                    gameOverMenu.style.display = 'block'; // using display block for flex parent
                }

                // Projectile Hit Enemy
                projectiles.forEach((projectile, pIndex) => {
                    const dist = Math.hypot(projectile.x - enemy.x, projectile.y - enemy.y);

                    if (dist - enemy.radius - projectile.radius < 1) {
                        
                        // Create explosions
                        for (let i = 0; i < enemy.radius * 2; i++) {
                            particles.push(new Particle(
                                projectile.x, 
                                projectile.y, 
                                Math.random() * 3, 
                                enemy.color,
                                {
                                    x: (Math.random() - 0.5) * (Math.random() * 8),
                                    y: (Math.random() - 0.5) * (Math.random() * 8)
                                }
                            ));
                        }

                        // Shrink or destroy
                        if (enemy.radius - 10 > 10) {
                            score += 50;
                            scoreEl.innerText = score;
                            // Smooth shrink
                            enemy.radius -= 10;
                            setTimeout(() => {
                                projectiles.splice(pIndex, 1);
                            }, 0);
                        } else {
                            score += 150;
                            scoreEl.innerText = score;
                            setTimeout(() => {
                                enemies.splice(index, 1);
                                projectiles.splice(pIndex, 1);
                            }, 0);
                        }
                    }
                });
            });
        }

        // Event Listeners for Buttons
        startBtn.addEventListener('click', () => {
            startMenu.classList.add('hidden');
            init();
            animate();
        });

        restartBtn.addEventListener('click', () => {
            gameOverMenu.style.display = 'none';
            init();
            animate();
        });

    </script>
</body>
</html>
