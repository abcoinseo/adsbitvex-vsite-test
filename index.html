  <title>AB Studio — Website</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: #fff;
      display: flex;
      min-height: 100vh;
      flex-direction: column;
    }
    header {
      padding: 20px;
      font-size: 28px;
      font-weight: bold;
      background: #1a1a1a;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-direction: column;
    }
    .top-ad, .billboard-ad {
      width: 100%;
      max-width: 970px;
      margin: 10px 0;
    }
    .sidebar {
      width: 220px;
      background: #1a1a1a;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      min-height: calc(100vh - 200px);
      position: fixed;
      top: 200px;
      left: 0;
    }
    .sidebar a {
      color: #fff;
      text-decoration: none;
      padding: 10px;
      border-radius: 6px;
      transition: 0.3s;
    }
    .sidebar a:hover {
      background: #007bff;
    }
    .sidebar-ad {
      margin-top: 20px;
    }
    main {
      margin-left: 240px;
      padding: 20px;
      flex: 1;
    }
    .hero, .section {
      padding: 30px 20px;
      text-align: center;
      background: #111;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    .hero h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }
    .hero p {
      font-size: 18px;
      opacity: 0.8;
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      background: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 16px;
    }
    footer {
      text-align: center;
      padding: 20px;
      background: #1a1a1a;
      opacity: 0.9;
      margin-top: 20px;
    }
    @media(max-width:900px){
      .sidebar { position: static; width: 100%; flex-direction: row; justify-content: space-around; min-height: auto; top: auto; }
      main { margin-left: 0; }
      .billboard-ad, .top-ad { max-width: 100%; }
      .sidebar-ad { display: none; }
    }
  </style>
</head>
